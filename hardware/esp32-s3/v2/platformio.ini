[platformio]
default_envs = esp32s3-stress-v2

[env:esp32s3-stress-v2]
; Reproduction environment matching the validated ESP32-S3 toolchain.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = time

; TinyAwait 1.1.2 uses C++20 coroutine support.
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=gnu++20

; Pin the exact source revision that was validated on hardware.
lib_deps =
    https://github.com/jafarmemar/TinyAwait.git#868304d548074a07274665ebe4d3fb26854c4f14
