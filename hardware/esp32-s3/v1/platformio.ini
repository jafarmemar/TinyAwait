[platformio]
default_envs = esp32s3

[env:esp32s3]
; Pinned to Arduino-ESP32 3.3.11 / ESP-IDF 5.5.5.
; This matches TinyAwait's current Arduino compile-validation target.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; USB-to-UART serial (the safest default for the supplied working ESP32-S3 project).
monitor_speed = 115200
monitor_filters = time

; TinyAwait uses C++20 language features and coroutines.
build_unflags =
    -std=gnu++11
    -std=gnu++14
    -std=gnu++17
build_flags =
    -std=gnu++20
    -DTINYAWAIT_TESTING=1

; Pin the exact TinyAwait revision under hardware validation so the result is reproducible.
lib_deps =
    https://github.com/jafarmemar/TinyAwait.git#868304d548074a07274665ebe4d3fb26854c4f14
