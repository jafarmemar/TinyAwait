name: Publish TinyAwait 1.1.1

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Publish v1.1.1
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          tag="v1.1.1"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to publish."
            exit 0
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## TinyAwait 1.1.1

          This release simplifies frame-memory configuration while keeping the 1.1.0 runtime unchanged.

          ### What changed

          - New code uses `TINYAWAIT_FRAME_POOL_BYTES` when an explicit frame-memory budget is needed.
          - `TINYAWAIT_FRAME_SIZE` is no longer defined or presented as a current configuration option.
          - Older projects that still define it remain source-compatible.
          - The default frame budget continues to scale with `TINYAWAIT_MAX_TASKS`.
          - README and test naming now follow the shared frame-pool model.

          The scheduler, variable-size allocator, coroutine syntax, no-heap behavior, and timing semantics are unchanged from 1.1.0.
          EOF

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "TinyAwait 1.1.1" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
