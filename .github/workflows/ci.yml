name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = gcc ]; then
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan/UBSan
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_CXX_COMPILER=g++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: ctest --test-dir build-sanitize --output-on-failure

  size-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Size-optimized build
        run: |
          g++ -std=c++20 -Isrc -Os -ffunction-sections -fdata-sections -fno-exceptions -fno-rtti \
            benchmarks/size_tinyawait.cpp -Wl,--gc-sections -o "$RUNNER_TEMP/tinyawait-size"
          size "$RUNNER_TEMP/tinyawait-size"

  arduino-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Show Arduino CLI version
        run: arduino-cli version
      - name: Install Arduino-ESP32 3.3.11 compile target
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile Arduino examples
        run: |
          for example in SingleDelay RepeatingDelay SequentialDelays NestedDelay; do
            arduino-cli compile \
              --fqbn esp32:esp32:esp32 \
              --library "$GITHUB_WORKSPACE" \
              "examples/${example}"
          done
