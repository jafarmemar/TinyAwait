name: Publish TinyAwait v1.1.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v1.1.1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create v1.1.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.1.1 --repo jafarmemar/TinyAwait >/dev/null 2>&1; then
            echo "Release v1.1.1 already exists."
            exit 0
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          TinyAwait v1.1.1 is a small, header-only C++20 library for heap-free, non-blocking `co_await` delays on microcontrollers and embedded systems.

          ### Highlights

          - Heap-free, fixed-memory coroutine frames
          - Millisecond `co_await` delays
          - Parent/child coroutine awaiting
          - 32 simultaneously-live coroutine frames by default
          - Automatic frame and timer slot reuse
          - Full `uint32_t` single-delay range
          - Wrap-safe 32-bit millisecond timing
          - Fast idle `poll()` path when no timer is active
          - Header-only with no external library dependencies
          - Consumer-friendly CMake target: `TinyAwait::TinyAwait`
          - Arduino and PlatformIO metadata included

          ### Verification

          - GCC and Clang host test suites
          - AddressSanitizer and UndefinedBehaviorSanitizer
          - Capacity, lifecycle, wraparound, maximum-delay, randomized timing, no-heap, stress, nested-await, and multi-translation-unit tests
          - Arduino examples compile-checked in CI using Arduino-ESP32 3.3.11 as one real C++20-capable Arduino target

          TinyAwait is platform-neutral. Arduino-compatible environments may use `millis()` automatically; other C++20-capable embedded targets can provide a monotonic millisecond clock through `TINYAWAIT_NOW_MS()`.

          See `README.md`, `CHANGELOG.md`, `VERIFICATION.md`, and `BENCHMARKS.md` for details.
          EOF

          gh release create v1.1.1 \
            --repo jafarmemar/TinyAwait \
            --target cca7dd3b64cb4930e1488477a7c64e3a1a0163ba \
            --title "TinyAwait v1.1.1" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
