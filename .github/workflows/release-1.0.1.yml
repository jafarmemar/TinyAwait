name: Publish TinyAwait 1.0.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-1.0.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish and verify v1.0.1 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v1.0.1"
          release_sha="f4b1060c456bfd3ef8e147cea553bd929419ad9c"
          marker=".release-v1.0.1-published"

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## TinyAwait 1.0.1

          Patch release fixing a rare 32-bit millisecond clock-wrap correctness issue.

          ### Fixed
          - Prevented `poll()` from continuing a due-timer scan with a pre-wrap `now` value after a resumed coroutine observes the wrap and immediately registers another delay.
          - The due scan now restarts from the updated clock state only when the epoch actually changes during resume/re-arm.
          - Added permanent regression coverage for another timer spanning the same wrap so premature firing cannot silently return.

          ### Verification
          - GCC and Clang host suites passed.
          - ASan/UBSan passed.
          - Size-oriented build passed.
          - Arduino-ESP32 examples compile-verified.
          - Extended local wrap-during-`poll()` stress passed.

          ### Compatibility
          - No public API changes.
          - No configuration changes.
          - Existing TinyAwait 1.0.0 users can update directly to 1.0.1.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            current_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$current_tag_sha" != "$release_sha" ]; then
              echo "Existing $tag targets $current_tag_sha; rebuilding it on $release_sha."
              release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
            fi
          fi

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$release_sha" \
              --title "TinyAwait 1.0.1" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

          final_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          test "$final_tag_sha" = "$release_sha"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null

          if ! gh api "repos/$GITHUB_REPOSITORY/contents/$marker?ref=main" >/dev/null 2>&1; then
            marker_content="$(printf 'v1.0.1 published at %s\n' "$release_sha" | base64 -w0)"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$marker" \
              -f message="Mark TinyAwait v1.0.1 release published" \
              -f content="$marker_content" \
              -f branch="main" >/dev/null
          fi
