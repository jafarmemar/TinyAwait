name: Publish TinyAwait 1.1.2

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm CI belongs to current main
        id: current
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          current_sha="$(git rev-parse origin/main)"
          if [ "$current_sha" != "$RELEASE_SHA" ]; then
            echo "Current main moved after this CI run; skipping."
            echo "match=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "match=true" >> "$GITHUB_OUTPUT"

      - name: Finalize 1.1.2 metadata
        if: steps.current.outputs.match == 'true'
        id: finalize
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          props = Path("library.properties")
          text = props.read_text()
          text = text.replace("version=1.1.1\n", "version=1.1.2\n", 1)
          props.write_text(text)

          verification = Path("VERIFICATION.md")
          text = verification.read_text()
          text = text.replace(
              "# Verification Report — TinyAwait 1.1.1",
              "# Verification Report — TinyAwait 1.1.2",
              1,
          )
          text = text.replace(
              "TinyAwait 1.1.1 simplifies frame-memory configuration without changing the scheduler, coroutine syntax, or variable-size frame allocator introduced in 1.1.0. Changes after the 1.1.1 release also replace the hard language-version gate with direct coroutine capability checks while keeping C++20 as the current source/build policy.",
              "TinyAwait 1.1.2 keeps the scheduler, coroutine syntax, variable-size frame arena, memory model, and public API from 1.1.1. This release replaces the hard language-version gate with direct coroutine capability checks and synchronizes public documentation and package metadata with that requirement while keeping C++20 as the current source/build policy.",
              1,
          )
          text = text.replace(
              "Version 1.1.1 does not change the allocator or scheduler runtime paths. The 1.1.0 performance comparison therefore remains applicable.",
              "Version 1.1.2 does not change the allocator or scheduler runtime paths. The 1.1.0 performance comparison therefore remains applicable.",
              1,
          )
          verification.write_text(text)
          PY

          if git diff --quiet -- library.properties VERIFICATION.md; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add library.properties VERIFICATION.md
            git commit -m "Finalize TinyAwait 1.1.2 metadata"
            git push origin HEAD:main
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release metadata
        if: steps.current.outputs.match == 'true' && steps.finalize.outputs.ready == 'true'
        run: |
          set -euo pipefail
          grep -q 'project(TinyAwait VERSION 1.1.2 LANGUAGES CXX)' CMakeLists.txt
          grep -q '"version": "1.1.2"' library.json
          grep -q '^version=1.1.2$' library.properties
          grep -q '^> \*\*Current version: 1.1.2\.\*\*$' README.md
          grep -q '^## 1.1.2 - 2026-08-13$' CHANGELOG.md
          grep -q '^# Verification Report — TinyAwait 1.1.2$' VERIFICATION.md

      - name: Publish v1.1.2
        if: steps.current.outputs.match == 'true' && steps.finalize.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          tag="v1.1.2"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag already exists; nothing to publish."
            exit 0
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## TinyAwait 1.1.2

          This patch release makes TinyAwait check the coroutine support it actually needs instead of relying only on the selected C++ language-version number.

          ### What changed

          - Compiler coroutine support is checked through `__cpp_impl_coroutine`.
          - `<coroutine>` availability and standard-library coroutine support are checked directly.
          - Missing coroutine capability now produces a clear TinyAwait compile error.
          - C++20 remains the current source/build policy; this release does not add C++17 compatibility.
          - Arduino and PlatformIO metadata, IDE keywords, README, changelog, and verification notes are synchronized with the current API and toolchain requirements.
          - `TINYAWAIT_FRAME_POOL_BYTES` is highlighted as the current frame-pool configuration API while deprecated `TINYAWAIT_FRAME_SIZE` compatibility remains available.

          The scheduler, variable-size frame allocator, coroutine frame layout, no-heap behavior, timing semantics, and public `Async` / `co_await` API are unchanged from 1.1.1.

          ### Verification

          The release is created only after the exact tagged `main` commit passes the full CI matrix: GCC and Clang host suites, allocator checks at `-O0`, `-O2`, and `-Os`, ASan/UBSan, size-oriented build, and Arduino-ESP32 3.3.11 example compilation.
          EOF

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "TinyAwait 1.1.2" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
